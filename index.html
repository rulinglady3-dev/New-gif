<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>A Letter For You ❤️</title>

</head>


 <body>

<div id="app">


<!-- Background Effects -->

<div id="stars"></div>



<!-- Envelope Screen -->

<div id="envelope-container">


    <img 
     src="envelope.png" 
     alt="Love Envelope"
     id="envelope"
     draggable="false">


    <p>
        This letter is for YU ❤️
    </p>


</div>





<!-- Letter Screen -->

<div id="letter-container">


    <div class="letter-window">

     id="letter-cat"

     alt="Cute cat"
     draggable="false">



        <p id="message">

           YUUU, Do you love me ? ❤️

        </p>





        <div id="letter-buttons">

            <img 
           class="btn yes-btn"
           src="yes.png"

           draggable="false">

        <div id="final-text"></div>

        <div id="final-question">


   <img 
     id="final-cat" 
     src="cat_heart.gif"

    </div>

            <img 
          id="final-gif"

          draggable="false">


<p id="final-link-text">

</p>


<a id="final-link" href="https://rulinglady3-dev.github.io/YUU-heart/" target="_blank">

    </div>


</div>


    </div>

</div>
