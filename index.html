<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter For You ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Background Effects -->

<div id="stars"></div>



<!-- Envelope Screen -->

<div id="envelope-container">


    <img 
    src="envelope.png" 
    alt="Love Envelope"
    id="envelope">


    <p>
        This letter is for YU ❤️
    </p>


</div>





<!-- Letter Screen -->

<div id="letter-container">


    <div class="letter-window">



        <img 
        id="letter-cat"
        src="cat_heart.gif"
        alt="Cute cat">



        <p id="message">

            YUUU, will you be my .....? ❤️

        </p>





        <div id="letter-buttons">

            
           <img 
            class="btn no-btn"
            src="no.png"
            alt="No button">


            
            <img 
            class="btn yes-btn"
            src="yes.png"
            alt="Yes button">



            
        </div>




        <div id="final-text"></div>

        <div id="final-question">


    <img id="final-cat" src="cat_heart.gif">


    <p id="final-message">
        Would you like to spend a little more time with me? ❤️
    </p>


    <div id="final-buttons">

        <img class="final-yes" src="yes.png">

        <img class="final-yes" src="yes.png">

    </div>


    <div id="link-message">
        Please click the link ❤️
    </div>


</div>


    </div>


</div>


<div id="signature">
    Made by Simge for Yu ❤️
</div>
